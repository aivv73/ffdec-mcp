name: AS2 tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Build and run synthetic AS2 and AS3 tests
        run: bash scripts/build.sh --batch-mode
